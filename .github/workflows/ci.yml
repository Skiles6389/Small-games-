name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.x
          cache: true
      - run: flutter pub get
      - name: Shared package
        working-directory: packages/game_core
        run: |
          flutter analyze
          flutter test
      - name: Sudoku app
        working-directory: apps/sudoku
        run: |
          flutter analyze
          flutter test
          flutter build web --release
