# Builds the Sudoku web app and publishes it to GitHub Pages as a playtest
# link: https://<owner>.github.io/<repo>/ (here: https://skiles6389.github.io/Small-games-/)
#
# One-time setup by the repo owner: Settings -> Pages -> Build and deployment
# -> Source: "GitHub Actions".
name: Deploy playtest to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; let an in-progress deploy finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.x
          cache: true
      - run: flutter pub get
      - name: Build Sudoku for the web
        working-directory: apps/sudoku
        # The site lives in a sub-folder named after the repo, so assets must
        # be loaded from "/<repo>/". Content hashes stop phones from mixing
        # cached files from an older deploy with new ones.
        run: >
          flutter build web --release
          --base-href "/${{ github.event.repository.name }}/"
          --web-content-hash
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/sudoku/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
