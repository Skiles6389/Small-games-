<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    Replaced by `flutter build web --base-href ...`. The GitHub Pages workflow
    sets it to "/<repo-name>/" so assets load from the right folder.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="description" content="Calm, dark-mode Sudoku.">

  <!--
    Lay the app out edge to edge on phones (notches, home indicator). The app
    keeps its content clear of them with SafeArea.
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0D1626">
  <meta name="color-scheme" content="dark">

  <!-- Add to Home Screen (iOS + Android) -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Sudoku">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <title>Sudoku</title>

  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #0D1626;
      overscroll-behavior: none;
    }
    #splash {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background: #0D1626;
      color: #8D9AB4;
      font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      transition: opacity 300ms ease-out;
    }
    #splash.hidden { opacity: 0; pointer-events: none; }
    #splash .grid {
      display: grid;
      grid-template-columns: repeat(3, 20px);
      gap: 5px;
    }
    #splash .grid span {
      width: 20px;
      height: 20px;
      border-radius: 5px;
      background: #1C2B45;
    }
    #splash .grid span.lit {
      background: #7FCFC4;
      animation: breathe 1.6s ease-in-out infinite;
    }
    @keyframes breathe { 50% { opacity: 0.45; } }
  </style>
</head>
<body>
  <!-- Shown while the game downloads; removed by flutter_bootstrap.js. -->
  <div id="splash" aria-label="Loading Sudoku">
    <div class="grid">
      <span></span><span></span><span></span>
      <span></span><span class="lit"></span><span></span>
      <span></span><span></span><span></span>
    </div>
    <div>Loading Sudoku…</div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
